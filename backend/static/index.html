<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PipeWise · 流程引擎平台</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo">PW</span>
      <span class="brand-name">PipeWise</span>
      <span class="brand-sub">流程引擎平台</span>
    </div>
    <nav class="nav">
      <a href="#/definitions" data-nav="definitions">流程定义</a>
      <a href="#/forms" data-nav="forms">表单</a>
      <a href="#/tasks" data-nav="tasks">我的待办</a>
      <a href="#/instances" data-nav="instances">实例</a>
      <a href="#/admin" data-nav="admin" id="nav-admin">运维</a>
    </nav>
    <div class="userbox">
      <span class="muted small" id="role-hint"></span>
      <select id="user-switch" title="演示用：切换当前用户"></select>
    </div>
  </header>
  <main id="view"></main>
  <div id="toast" class="toast" hidden></div>
  <div id="modal" class="modal" hidden>
    <div class="modal-card">
      <div class="modal-head"><span id="modal-title"></span><button class="icon" id="modal-close">✕</button></div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-foot" id="modal-foot"></div>
    </div>
  </div>
</div>
<script src="/app.js"></script>
</body>
</html>
